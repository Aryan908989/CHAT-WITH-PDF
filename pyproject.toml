[project]
name = "pdf-chat"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aryan", email = "asaryan1k@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "groq>=1.7.0",
    "pypdf>=6.21.1",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.19.1",
    "sentence-transformers>=6.1.0",
    "streamlit>=1.66.0",
    "torchvision>=0.29.1",
]

[project.scripts]
pdf-chat = "pdf_chat:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
